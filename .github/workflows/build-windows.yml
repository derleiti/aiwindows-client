name: Build AIWindows Client

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version override (e.g. 1.0.0-beta1)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Artifact version override'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Validate Python package
        shell: pwsh
        run: |
          python -m compileall -q aiwindows_client
          python -c "from aiwindows_client.core.hardware_detect import hardware_detector; from aiwindows_client.core.local_mcp import LocalMCPExecutor; from aiwindows_client.core.cli_agents import agent_detector; from aiwindows_client.core.planning_prompt import DEFAULT_SYSTEM_PROMPT; from aiwindows_client.core.mcp_stdio_server import MCPStdioServer; print('WINDOWS_IMPORT_SMOKE_OK')"

      - name: Extract Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep -E "^VERSION" aiwindows_client/version.py | cut -d'"' -f2)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Create Icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; img=Image.open('icon.jpg'); img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build portable executable
        shell: pwsh
        run: |
          pyinstaller `
            --name="AIWindows-Client" `
            --onefile `
            --windowed `
            --icon="icon.ico" `
            --add-data="aiwindows_client/ui;aiwindows_client/ui" `
            --add-data="aiwindows_client/core;aiwindows_client/core" `
            --add-data="aiwindows_client/translations;aiwindows_client/translations" `
            --add-data="aiwindows_client/assets;aiwindows_client/assets" `
            --add-data="icon.jpg;." `
            --hidden-import=PyQt6.QtWebEngineWidgets `
            --hidden-import=PyQt6.QtWebEngineCore `
            --hidden-import=httpx `
            --hidden-import=aiohttp `
            --hidden-import=websockets `
            --hidden-import=cryptography `
            --hidden-import=PIL `
            --hidden-import=winpty `
            --hidden-import=pyte `
            --clean `
            --noconfirm `
            run_aiwindows.py
          $version = '${{ steps.version.outputs.version }}'
          Move-Item dist/AIWindows-Client.exe "dist/AIWindows-Client-$version.exe"
          Copy-Item "dist/AIWindows-Client-$version.exe" dist/AIWindows-Client-latest.exe

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exe = Resolve-Path "dist/AIWindows-Client-$version.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--hwinfo' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "portable EXE smoke failed with exit code $($p.ExitCode)" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'EXE has no MZ header' }
          Write-Host 'WINDOWS_EXE_SMOKE_OK'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup.exe
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exeName = "AIWindows-Client-$version.exe"
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" "/DMyAppExe=$exeName" installer/AIWindows-Client.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "dist/AIWindows-Client-Setup-$version.exe"
          if (!(Test-Path $setup)) { throw "setup.exe missing: $setup" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $setup))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Setup has no MZ header' }
          Write-Host 'WINDOWS_SETUP_SMOKE_OK'

      - name: Checksums and metadata
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          cd dist
          sha256sum "AIWindows-Client-${VERSION}.exe" "AIWindows-Client-Setup-${VERSION}.exe" > SHA256SUMS-windows.txt
          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "platform": "windows-x86_64",
            "portable": "AIWindows-Client-${VERSION}.exe",
            "installer": "AIWindows-Client-Setup-${VERSION}.exe"
          }
          EOF
          cat > BUILD-METADATA.txt <<EOF
          Product: AIWindows Client
          Version: ${VERSION}
          Platform: windows-x86_64
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Runner OS: ${RUNNER_OS}
          Python: $(python --version 2>&1)
          Portable: AIWindows-Client-${VERSION}.exe
          Installer: AIWindows-Client-Setup-${VERSION}.exe
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AIWindows-Client-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            dist/AIWindows-Client-${{ steps.version.outputs.version }}.exe
            dist/AIWindows-Client-Setup-${{ steps.version.outputs.version }}.exe
            dist/AIWindows-Client-latest.exe
            dist/version.json
            dist/BUILD-METADATA.txt
            dist/SHA256SUMS-windows.txt
